name: social-short
description: >
  Vertical short-form for TikTok / Reels / Shorts. The one place aggressive
  filler removal is correct: the format punishes any dead air, and viewers
  expect the clipped cadence rather than being jarred by it.

# What an editor is actually making. The recipe is the engineering answer --
# thresholds, tracks, timing -- and nobody picks an edit by its filler mode.
# This is the same settings under the name of the deliverable, so the panel can
# ask one question instead of twelve.
format:
  label: Reel / Short
  aspect: vertical
  duration: 15
  duration_mode: exactly
  # No cut_rate: this one follows the words. For a montage that cuts to the
  # music, the deliverable is "Promo -- cuts to music".
  # What someone types when they want this kind of edit.
  # Deliberately no platform words here. "tiktok" and "vertical" say what SHAPE
  # the video is, which PLATFORM_ASPECTS already reads; as recipe keywords they
  # also outrank real ones on length, so "a tiktok video ... dramatic promo"
  # chose this over the montage recipe on the strength of the wrong half of the
  # sentence.
  keywords:
    - short
    - reel
    - talking
    - to camera
    - vlog
    - piece to camera
  order: 1

sequence:
  timebase: "30"
  video_tracks: 3          # V1 speaker, V2 b-roll, V3 captions/graphics
  audio_tracks: 2
  name_template: "{job}_short_v1"
  crossfade_frames: 1      # anything longer reads as sloppy at this pace

detection:
  min_silence: 0.25        # dead air is the format's main failure mode
  lead_in: 0.06
  tail: 0.04
  trim_head_tail: true

  filler_mode: aggressive  # removes 'like', 'you know', 'basically'
  keep_fillers: ["right"]  # too often a genuine beat at the end of a sentence
  remove_stutters: true
  stutter_max_gap: 0.45

  min_clip_length: 0.25
  min_confidence: 0.60     # tighter cuts need a more trustworthy transcript
  protect_margin: 0.20

music:
  # A vertical short lives or dies on whether the picture moves with the track,
  # so the grid wins and a clipped word at a join is an acceptable price.
  #
  # One beat, not a bar: speech segments here are often under a second, and a
  # two-beat quantum threw away every one that could not fill 1.15s. Any beat is
  # still the beat -- the cut lands with the track either way.
  beats_per_cut: 1
  beat_priority: music

transcription:
  provider: whisper-local
  model: large-v3
  language: auto           # detected from the audio; the panel can override
  word_timestamps: true

roles:
  speaker: { video_track: 0, audio_track: 0 }
  broll:   { video_track: 1, audio_track: -1 }

brand:
  lut: brand-punch
  mogrts:
    captions: kinetic-captions
    hook: hook-title
  loudness_target_lufs: -14   # platform normalisation target
