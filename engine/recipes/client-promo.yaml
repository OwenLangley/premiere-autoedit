name: client-promo
description: >
  Branded promo or commercial. Pacing here is music-led, not speech-led, so the
  automated pass deliberately does less: it assembles usable takes and applies
  the brand look, then leaves rhythm to the editor. Cutting to the transcript
  would fight the track.

format:
  label: Client promo
  aspect: landscape
  duration: 60
  duration_mode: about
  # Speech-led, like social-short: the cut follows the interview.
  # What someone types when they want this kind of edit.
  keywords:
    - client
    - testimonial
    - case study
    - corporate
    - brand film
    # Japanese. 導入事例 and not a bare 事例, which lives inside ordinary
    # sentences; お客様の声 is what a testimonial is actually called.
    - お客様の声
    - 導入事例
    - 会社紹介
    - ブランドムービー
  order: 3
  # What a job gets when the description names no kind of edit. This one, and
  # not the punchier ones, because it is the recipe that does least: 0.70s of
  # silence before a cut, conservative filler removal, longer clips, and the
  # beat giving way to speech. Guessing wrong here is invisible -- nobody chose
  # it -- so the guess should be the cautious one. It is also what shipped as the
  # silent default when the panel still had a dropdown, alphabetically rather
  # than on purpose.
  default: true

sequence:
  timebase: "25"
  video_tracks: 4          # V1 interview, V2 b-roll, V3 graphics, V4 logo
  audio_tracks: 4
  name_template: "{job}_promo_v1"
  crossfade_frames: 2

detection:
  min_silence: 0.70        # long pauses are often intentional against music
  lead_in: 0.20
  tail: 0.15
  trim_head_tail: true

  filler_mode: conservative
  remove_stutters: true
  stutter_max_gap: 0.60

  min_clip_length: 0.60    # promos favour longer, calmer clips
  min_confidence: 0.60
  protect_margin: 0.30

music:
  # A client's words are the deliverable. Cuts move to the beat only where the
  # silence already had room for it.
  beat_priority: speech

transcription:
  provider: whisper-local
  model: large-v3
  language: auto           # detected from the audio; the panel can override
  word_timestamps: true

roles:
  interview: { video_track: 0, audio_track: 0 }
  broll:     { video_track: 1, audio_track: -1 }
  music:     { video_track: -1, audio_track: 2 }

brand:
  lut: brand-neutral
  mogrts:
    lower_third: lower-third
    endcard: brand-endcard
  loudness_target_lufs: -16
