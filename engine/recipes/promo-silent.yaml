name: promo-silent
description: >
  Silent promo, b-roll reel or any footage with no usable speech. Cuts are driven
  by the pictures instead of a transcript: shot detection finds the boundaries,
  quality scoring throws away the black, frozen, soft and shaky ones, and when a
  music bed is supplied the cuts land on the beat.

format:
  # The montage deliverable. Vertical because that is what a promo is posted as,
  # and `visual: true` because cutting to a beat means cutting to pictures --
  # a card offering "every beat" while the engine cuts to speech is a promise
  # the request cannot keep.
  label: Promo — cuts to music
  aspect: vertical
  duration: 15
  duration_mode: exactly
  cut_rate: 1
  visual: true
  # What someone types when they want this kind of edit.
  keywords:
    - promo
    - montage
    - trailer
    - teaser
    - sizzle
    - advert
    - commercial
    - b-roll
    - broll
    - highlight
    - highlights
    - music video
  order: 2

sequence:
  timebase: "25"
  video_tracks: 3          # V1 selects, V2 b-roll/overlay, V3 graphics
  audio_tracks: 2          # A1 music bed, A2 spare
  name_template: "{job}_promo_v1"
  crossfade_frames: 2

visual:
  scene_threshold: 0.30    # lower finds more cuts; raise for grainy footage
  min_shot: 0.50           # shorter detections fold into their neighbour
  max_shot: 6.0            # long takes get subdivided so selection has choices

  # Quality gates. Loosen these first if too much gets rejected -- the warning
  # in the plan tells you how many shots were dropped and why.
  drop_black: true
  min_brightness: 16.0
  min_sharpness: 0.40
  min_motion: 0.05
  max_motion: 30.0

  lead_trim: 0.15          # shots usually settle after the cut
  tail_trim: 0.10

  shot_duration: 1.60      # nominal take length when there is no music bed
  snap_to_beats: true
  beats_per_shot: 4        # one bar at 4/4
  min_beat_confidence: 0.15

# Drop a single audio-only file alongside the footage and it becomes the bed.
# Only ever fires when there is exactly one candidate -- guessing between several
# would score the promo with the wrong track.
auto_music: true

music:
  # No speech to protect at all here -- the grid is the only timing there is.
  # The take LENGTH is already chosen in whole bars by the picture planner
  # (`beats_per_shot`); this quantum only decides what the placer may round to,
  # and one beat lets a short shot survive instead of being dropped.
  beats_per_cut: 1
  beat_priority: music

roles:
  music: { video_track: -1, audio_track: 1 }

brand:
  lut: brand-punch
  mogrts:
    endcard: brand-endcard
  loudness_target_lufs: -14

# Unused on silent footage, but the loader still validates it.
detection:
  min_silence: 0.50
  lead_in: 0.15
  tail: 0.10
